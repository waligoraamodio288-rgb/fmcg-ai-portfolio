<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>视频分镜预览</title><style>*{box-sizing:border-box}body{margin:0;background:#f4f2ec;color:#172f31;font:17px/1.8 "Microsoft YaHei",sans-serif}main{max-width:1060px;margin:auto;padding:32px 28px 72px}nav{display:flex;gap:24px;flex-wrap:wrap;border-bottom:1px solid #c8d3cd;padding-bottom:18px}a{color:#136452;text-underline-offset:4px}h1{font-size:clamp(32px,5vw,58px);line-height:1.2;letter-spacing:-1px;margin:28px 0}h2{font-size:25px;margin-top:38px}.lead{font-size:23px;max-width:800px}.tag{color:#547368;font-size:14px;letter-spacing:2px}.cards,.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}.card,.metrics>div{padding:26px;background:white;border:1px solid #d1dcd5;border-radius:12px}.card h2{margin-top:8px}.metrics strong{display:block;font-size:30px}.flow{padding:24px;background:#dcece2;border-radius:12px}footer{margin-top:54px;font-size:14px;border-top:1px solid #cad7ce;padding-top:18px}button{padding:12px 20px;background:#175842;color:white;border:0;border-radius:6px;font:inherit;cursor:pointer}:focus-visible{outline:3px solid #b47a20;outline-offset:4px}.scene{min-height:280px;padding:28px;background:white;border-radius:12px}@media(max-width:500px){main{padding:20px 18px}nav{gap:12px}.lead{font-size:19px}}</style><main><nav><a href="index.html">主页</a><a href="case-p1.html">渠道复盘</a><a href="case-p2.html">状态核验</a><a href="article.html">文章</a><a href="storyboard.html">演示分镜</a></nav><p class="tag">3分40秒讲解材料 / 静态分镜预览</p><h1>把业务结论变成可核对的证据</h1><p>这是可逐页审阅的分镜，不是已经录制的视频或实时运行演示。</p><div class="scene" id="scene"></div><p><button id="prev">上一镜</button> <button id="next">下一镜</button></p><p id="count" aria-live="polite"></p><script>const scenes=[["00:00–00:25", "先声明范围", "这是AI协作模拟作品，全部订单、门店与政策自编。今天只看口径与异常，不讨论真实企业收益。"], ["00:25–00:55", "净销售额7020", "样本销售7160，减本期退款140。重复订单先处理，跨期退货另列复核。"], ["00:55–01:25", "毛利保持待补证", "O04成本缺失。已知成本子集1950不能替代全量毛利；销量变化也不是促销因果。"], ["01:25–02:00", "解释不能脱离输入", "本地Python计算，AI草稿存档并绑定输入。换数据后需要重新生成并审核解释。"], ["02:00–02:35", "异常需要责任与证据", "陈列、临期和退货分别形成待办。认领、证据、复核以后才允许模拟关闭。"], ["02:35–03:10", "点击不是完成", "P2使用中性内存对象。回执未知时只读核验一次；目标错或仍未知就停止，不重复动作。"], ["03:10–03:40", "从作品回到岗位", "这些作品用于讨论渠道数字化和AI实施验收。没有真实ROI、实时模型API或个人独立工程完成声明。"]];let i=0;function render(){let s=scenes[i];document.getElementById("scene").innerHTML="<p>"+s[0]+"</p><h2>"+s[1]+"</h2><p>"+s[2]+"</p>";document.getElementById("count").textContent=(i+1)+" / "+scenes.length;document.getElementById("prev").disabled=i===0;document.getElementById("next").disabled=i===scenes.length-1}document.getElementById("prev").onclick=()=>{i--;render()};document.getElementById("next").onclick=()=>{i++;render()};render();</script><footer>作品展示 v1.1 · AI协作模拟作品<br>不含企业内部数据；展示结果不能替代真实业务验收。</footer></main></html>
